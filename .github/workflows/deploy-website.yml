name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - discussions/**
      - docs/**
      - scripts/build-content.py
      - scripts/content.py
      - scripts/validate-records.py
      - scripts/check-content.py
      - scripts/requirements-content.txt
      - scripts/discord-alerts.py
      - infra/aws/**
      - slices/**
      - scripts/public_files.py
      - .github/workflows/deploy-website.yml
  # Acceptance commits use GITHUB_TOKEN, so their pushes do not trigger this
  # workflow. The successful publisher run explicitly triggers a fresh build.
  workflow_run:
    workflows: [Publish accepted solve]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.AWS_WEBSITE_ROLE != '' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Never check out the triggering proposal branch or consume its artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build and validate the accepted site content
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-content.txt
          python3 scripts/build-content.py
          python3 scripts/validate-records.py
          python3 scripts/check-content.py
          python3 infra/aws/package.py --site . --output "$RUNNER_TEMP/sextics-release" --static-only
      - name: Obtain short-lived website publishing credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_WEBSITE_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '977936242184'
      - name: Prepare Discord announcement baseline
        env:
          DISCORD_SOLVE_WEBHOOK_URL: ${{ secrets.DISCORD_SOLVE_WEBHOOK_URL }}
        run: python3 scripts/discord-alerts.py prepare --bucket hodge-sextics-site-977936242184-us-east-1 --site "$RUNNER_TEMP/sextics-release/public"
      - name: Publish content
        env:
          SITE_BUCKET: hodge-sextics-site-977936242184-us-east-1
          DISTRIBUTION: E2D78CDNFUIIQG
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/sextics-release/public"
          aws s3 sync "$public/" "s3://$SITE_BUCKET/" --exclude index.html --cache-control 'public,max-age=60' --sse AES256 --only-show-errors
          aws s3 cp "$public/index.html" "s3://$SITE_BUCKET/index.html" --cache-control 'public,max-age=60' --sse AES256 --only-show-errors
          python3 infra/aws/retire.py --bucket "$SITE_BUCKET" --manifest "$RUNNER_TEMP/sextics-release/build.json"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text
      - name: Announce published solves and new atlas entries
        env:
          DISCORD_SOLVE_WEBHOOK_URL: ${{ secrets.DISCORD_SOLVE_WEBHOOK_URL }}
        run: python3 scripts/discord-alerts.py send --bucket hodge-sextics-site-977936242184-us-east-1 --site "$RUNNER_TEMP/sextics-release/public"
