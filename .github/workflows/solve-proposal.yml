name: Solve proposal

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: solve-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Protected proposal verification
    runs-on: ${{ vars.SOLVE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 85
    steps:
      - name: Resolve current immutable PR commits
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/pulls/$PR" > /tmp/solve-pr.json
          gh api "repos/$REPO/git/ref/heads/main" > /tmp/solve-main.json
          python3 - <<'PYCODE'
          import json, os, re
          p=json.load(open('/tmp/solve-pr.json'))
          main=json.load(open('/tmp/solve-main.json'))
          assert p['state']=='open' and p['base']['repo']['full_name']==os.environ['REPO']
          assert p['base']['ref']=='main'
          assert main['ref']=='refs/heads/main' and main['object']['type']=='commit'
          # A PR's recorded base SHA can remain at its creation-time value.
          # Bind checks to the live branch and the workflow revision actually run.
          assert main['object']['sha']==os.environ['GITHUB_SHA'], 'Main advanced since this workflow was scheduled; dispatch a fresh check from main'
          values={'base':main['object']['sha'],'head':p['head']['sha'],'author':p['user']['login'],'pr':str(p['number'])}
          assert all(re.fullmatch(r'[0-9a-f]{40}',values[k]) for k in ('base','head'))
          assert re.fullmatch(r'[A-Za-z0-9-]+',values['author'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in values.items(): print(f'{k}={v}',file=f)
          PYCODE
      # Never execute the PR's workflow, scripts, setup files, or Lake configuration.
      - name: Check out the trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.context.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch proposal and identify solve changes
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          HEAD: ${{ steps.context.outputs.head }}
          BASE: ${{ steps.context.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ && "$HEAD" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]]
          # Authentication is limited to this fetch. The sandbox never receives the token.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          if [ "$(python3 scripts/proposals/classify.py --base "$BASE" --head "$HEAD")" = solve ]; then
            echo 'solve=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Maintenance PR: no solve to verify. See Repository build for release validation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark this exact commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.context.outputs.head }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api "repos/$REPO/statuses/$HEAD" -f state=pending -f context=solve/lean -f description='Checking the submitted proposal' -f target_url="$RUN"
      - name: Prepare Python
        if: steps.proposal.outputs.solve == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install trusted Python dependencies
        if: steps.proposal.outputs.solve == 'true'
        run: python3 -m pip install -r scripts/requirements-content.txt
      - name: Check proposal structure before preparing Lean
        id: structure
        if: steps.proposal.outputs.solve == 'true'
        env:
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          AUTHOR: ${{ steps.context.outputs.author }}
          PR: ${{ steps.context.outputs.pr }}
        run: python3 scripts/proposals/check.py --base "$BASE" --head "$HEAD" --author "$AUTHOR" --pr "$PR" --output /tmp/proposal-report --structure-only
      - name: Validate explanation links and displayed mathematics
        id: explanation
        if: steps.proposal.outputs.solve == 'true'
        env:
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          AUTHOR: ${{ steps.context.outputs.author }}
        run: python3 scripts/proposals/check-explanation.py --base "$BASE" --head "$HEAD" --author "$AUTHOR" --output /tmp/proposal-report
      - name: Make room for Lean and its dependency cache
        if: steps.proposal.outputs.solve == 'true'
        run: |
          # These unrelated SDKs are preinstalled on the disposable GitHub runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install pinned Lean toolchain
        if: steps.proposal.outputs.solve == 'true'
        run: |
          set -euo pipefail
          # Official installer; no candidate code runs in this preparation step.
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reuse pinned protected Lean dependencies
        if: steps.proposal.outputs.solve == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            formal/lean/.lake
            ~/.elan/toolchains
          key: protected-lean-v3-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml', 'formal/lean/HodgeComputer.lean', 'formal/lean/HodgeTestbed.lean', 'formal/lean/HodgeComputer/**/*.lean', 'formal/lean/HodgeTestbed/**/*.lean') }}
      - name: Prepare protected dependencies
        if: steps.proposal.outputs.solve == 'true'
        working-directory: formal/lean
        run: |
          lake exe cache get
          lake build HodgeComputer.Verify
      - name: Verify exact statement, kernel replay, and axioms
        id: proof
        if: steps.proposal.outputs.solve == 'true'
        env:
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          AUTHOR: ${{ steps.context.outputs.author }}
          PR: ${{ steps.context.outputs.pr }}
        run: python3 scripts/proposals/check.py --base "$BASE" --head "$HEAD" --author "$AUTHOR" --pr "$PR" --output /tmp/proposal-report
      - name: Preserve check receipts
        if: always() && steps.proposal.outputs.solve == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solve-${{ steps.context.outputs.pr }}-${{ steps.context.outputs.head }}
          path: /tmp/proposal-report
          retention-days: 30
      - name: Reject a result for a superseded PR or base
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.context.outputs.head }}
          BASE: ${{ steps.context.outputs.base }}
          PR: ${{ steps.context.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR" > /tmp/current-pr.json
          gh api "repos/$REPO/git/ref/heads/main" > /tmp/current-main.json
          python3 - <<'PYCODE'
          import json, os
          p=json.load(open('/tmp/current-pr.json'))
          main=json.load(open('/tmp/current-main.json'))
          assert p['state']=='open' and p['base']['ref']=='main' and p['base']['repo']['full_name']==os.environ['REPO'] and p['head']['sha']==os.environ['HEAD'], 'PR changed during checking; rerun against the current commits'
          assert main['ref']=='refs/heads/main' and main['object']['type']=='commit' and main['object']['sha']==os.environ['BASE'], 'Main changed during checking; rerun against the current commits'
          PYCODE
      - name: Explain a failed check
        if: failure()
        env:
          CONTEXT: ${{ steps.context.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
          EXPLANATION: ${{ steps.explanation.outcome }}
          PROOF: ${{ steps.proof.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
        run: |
          message='Workflow preparation or reporting failed. Read the first failed step; this does not establish that the proof is invalid.'
          if [ "$CONTEXT" = failure ]; then
            message='The PR or main no longer matches the scheduled run. Read the commit-resolution error; if main advanced, start a fresh Solve proposal run on main.'
          elif [ "$STRUCTURE" = failure ]; then
            message='Submission format validation failed before Lean ran. See the structure-check error and CONTRIBUTING.md for the permitted files and manifest.'
          elif [ "$EXPLANATION" = failure ]; then
            message='The solution explanation contains a broken local link or invalid displayed mathematics. Read the explanation-check error for the file and link/formula to fix. Lean has not run.'
          elif [ "$PROOF" = failure ]; then
            message='Proof verification did not complete successfully. See the Lean/kernel/audit error and the preserved solve artifact for compiler logs.'
          elif [ "$FRESHNESS" = failure ]; then
            message='The PR or main changed during checking. This result is stale; start a fresh Solve proposal run on main before merging.'
          fi
          echo "::error::$message"
          printf '### Check not accepted\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Record result on the submitted commit
        if: always() && !cancelled() && steps.context.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.context.outputs.head }}
          REPO: ${{ github.repository }}
          RESULT: ${{ job.status }}
          IS_SOLVE: ${{ steps.proposal.outputs.solve }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          description='Proposal verification failed; see workflow details'
          if [ "$state" = success ]; then
            description='Lean verification passed'
            if [ "$IS_SOLVE" != true ]; then description='No solve changes; see Repository build'; fi
          fi
          gh api "repos/$REPO/statuses/$HEAD" -f state="$state" -f context=solve/lean -f description="$description" -f target_url="$RUN"
