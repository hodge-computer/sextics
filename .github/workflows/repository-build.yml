name: Repository build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lean: ${{ steps.scope.outputs.lean }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Prepare content and CI tools
        run: python3 -m pip install -r scripts/requirements-content.txt
      - name: Test maintenance routing and credit recording
        run: |
          python3 scripts/test-maintenance.py
          python3 scripts/test-publication.py
      - name: Check the book's finite algebraic witnesses
        run: |
          python3 scripts/verify-norm-contact-span.py
          python3 scripts/verify-extension-dimensions.py
          python3 scripts/verify-hodge-locus-span.py
      - name: Identify affected Lean modules and solves
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check-library.py --base "$BASE" --plan > /tmp/lean-plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open('/tmp/lean-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('lean=' + str(bool(plan['matrix']['include'])).lower(), file=output)
              print('matrix=' + json.dumps(plan['matrix']), file=output)
          PY
      - name: Build the public release
        run: |
          set -euo pipefail
          python3 scripts/build-content.py
          python3 scripts/validate-records.py
          python3 scripts/check-content.py
          python3 infra/aws/package.py --site . --output "$RUNNER_TEMP/release" --static-only
  lean-build:
    name: Build shared Lean library
    needs: build
    if: needs.build.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Lean
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-content.txt
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: repository-lean-dependencies-v2-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml') }}
      - name: Fetch Mathlib build cache
        working-directory: formal/lean
        run: lake exe cache get
      - name: Build every shared dependency needed by the affected checks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-library.py --base "$BASE" --phase build
      - name: Export compiled shared library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-lean-library
          path: formal/lean/.lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  lean:
    name: Lean / ${{ matrix.instance || 'shared library' }}
    needs: [build, lean-build]
    if: needs.build.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Lean
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-content.txt
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Lean dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: repository-lean-dependencies-v2-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml') }}
      - name: Fetch dependencies if the optional cache is unavailable
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: formal/lean
        run: lake exe cache get
      - name: Download this run's compiled shared library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shared-lean-library
          path: formal/lean/.lake/build
      - name: Recheck affected mathematics without rebuilding the shared library
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PHASE: ${{ matrix.phase }}
          INSTANCE: ${{ matrix.instance }}
        run: python3 scripts/check-library.py --base "$BASE" --phase "$PHASE" --instance "$INSTANCE" --prepared
